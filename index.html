<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --accent-color: #0066cc;
            --card-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --accent-color: #4da3ff;
                --card-bg: #1e1e1e;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 550px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin: 20px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .details {
            font-size: 0.95rem;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            padding-top: 20px;
            margin-top: 20px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>CUEC Will Be Right Back</h1>
        <p>Our website is currently undergoing scheduled maintenance to improve your experience. We apologize for the inconvenience and appreciate your patience.</p>
        
        <div class="details">
            <p>Expected return: <strong>Check back shortly</strong></p>
            <p>Need immediate assistance? Contact us at <a href="mailto:support@example.com">cr8v.muktadir@gmail.com</a></p>
        </div>
    </div>

</body>
</html>
